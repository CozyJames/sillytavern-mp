<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — SillyTavern MP</title>
  <style>
    :root {
      --bg-0: rgb(23,23,23);
      --bg-2: rgb(31,31,31);
      --bg-3: rgb(20,20,20);
      --text-primary: rgb(220,220,210);
      --text-dim: rgb(190,190,180);
      --text-muted: rgb(145,145,145);
      --text-accent: rgb(225,138,36);
      --text-title: rgb(235,235,225);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --accent: rgb(225,138,36);
      --accent-dim: rgba(225,138,36,0.14);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --radius: 8px;
      --radius-sm: 5px;
      --shadow: 0 2px 14px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0;
      font-family: "Noto Sans", Arial, Helvetica, sans-serif;
      background: var(--bg-0);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%; max-width: 340px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }
    .icon {
      width: 48px; height: 48px; margin: 0 auto 16px;
      background: var(--accent-dim); border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    h1 {
      font-size: 18px; font-weight: 600; color: var(--text-title);
      text-align: center; margin: 0 0 4px;
    }
    .subtitle {
      font-size: 13px; color: var(--text-muted);
      text-align: center; margin: 0 0 24px;
    }
    label {
      display: block; font-size: 12px; color: var(--text-dim);
      margin: 0 0 6px;
    }
    .field { margin-bottom: 14px; }
    input {
      width: 100%; padding: 10px 12px;
      background: var(--bg-3); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-size: 14px; outline: none; transition: border 0.15s;
      font-family: inherit;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; margin-top: 6px;
      background: var(--accent); color: #1a1200; border: none;
      border-radius: var(--radius-sm); padding: 11px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: filter 0.15s; font-family: inherit;
    }
    button:hover { filter: brightness(1.1); }
    .error {
      display: none;
      background: var(--red-dim); border: 1px solid var(--red);
      color: #fca5a5; font-size: 13px;
      border-radius: var(--radius-sm); padding: 9px 12px;
      margin-bottom: 16px;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎭</div>
    <h1>SillyTavern MP</h1>
    <p class="subtitle">Sign in to join the session</p>
    <div class="error" id="error">Wrong username or password.</div>
    <form method="POST" action="/login">
      <div class="field">
        <label for="user">Username</label>
        <input type="text" id="user" name="user" autocomplete="username" autofocus required />
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input type="password" id="pass" name="pass" autocomplete="current-password" required />
      </div>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('error')) {
      document.getElementById('error').classList.add('show');
    }
  </script>
</body>
</html>
