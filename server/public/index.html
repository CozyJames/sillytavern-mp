<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SillyTavern MP Client</title>
  <style>
    /* Tokens lifted from SillyTavern's own default theme (public/style.css):
       --SmartThemeBodyColor, --SmartThemeEmColor, --SmartThemeQuoteColor
       (the accent), --SmartThemeChatTintColor, avatar/icon sizing. This
       client is meant to look and behave like the tavern itself, not a
       separate chat-bubble app skin. */
    :root {
      --bg-0: rgb(23,23,23);
      --bg-1: rgb(23,23,23);
      --bg-2: rgb(31,31,31);
      --bg-3: rgb(20,20,20);
      --text-primary: rgb(220,220,210);
      --text-dim: rgb(190,190,180);
      --text-muted: rgb(145,145,145);
      --text-accent: rgb(225,138,36);
      --text-title: rgb(235,235,225);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --accent: rgb(225,138,36);
      --accent-dim: rgba(225,138,36,0.14);
      --accent-glow: rgba(225,138,36,0.3);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.15);
      --amber: #facc15;
      --amber-dim: rgba(250,204,21,0.15);
      --radius: 8px;
      --radius-sm: 5px;
      --shadow: 0 2px 14px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0;
      font-family: "Noto Sans", Arial, Helvetica, sans-serif;
      background: var(--bg-0);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      font-size: 15px;
    }
    body { display: flex; flex-direction: column; align-items: center; }
    button { font-family: inherit; }

    /* ═══════ TOP BAR ═══════ */
    #online-bar {
      width: 100%; max-width: 960px;
      background: var(--bg-2);
      padding: 0 10px;
      height: 35px; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 13px; color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .dot-online {
      width: 7px; height: 7px;
      background: #4caf50; border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-offline {
      width: 7px; height: 7px;
      background: var(--red); border-radius: 50%;
      flex-shrink: 0;
    }
    .user-tag {
      background: var(--accent-dim);
      padding: 1px 8px; border-radius: var(--radius-sm);
      font-size: 12px; color: var(--text-accent);
      border: 1px solid rgba(225,138,36,0.2);
    }
    #online-users { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .bar-spacer { flex: 1 1 auto; }
    .context-meter { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
    .context-meter-bar { width: 50px; height: 4px; border-radius: 2px; background: var(--bg-3); overflow: hidden; }
    .context-meter-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s ease; }
    .context-meter-text { opacity: 0.85; }
    .context-meter.warn .context-meter-text { color: var(--amber); opacity: 1; }
    .context-meter.warn .context-meter-fill { background: var(--amber); }
    .context-meter.crit .context-meter-text { color: var(--red); opacity: 1; }
    .context-meter.crit .context-meter-fill { background: var(--red); }
    .icon-btn {
      background: none; border: none; color: var(--text-primary);
      width: 30px; height: 30px; border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; opacity: 0.7; transition: opacity 0.15s, filter 0.15s;
      padding: 0; flex-shrink: 0;
    }
    .icon-btn:hover { opacity: 1; filter: brightness(1.25); }

    /* ═══════ LOAD OLDER ═══════ */
    /* Shown only while actually fetching (triggered by scrolling to the
       top edge — see the #chat scroll listener), not a standing button. */
    #load-older-indicator {
      width: 100%; max-width: 960px; flex-shrink: 0;
      padding: 8px; text-align: center;
      color: var(--text-muted); font-size: 12px; font-style: italic;
      display: none;
    }
    #load-older-indicator.active { display: block; }

    /* ═══════ CHAT ═══════ */
    #chat {
      width: 100%; max-width: 960px;
      flex: 1 1 auto;
      padding: 4px 0 150px;
      overflow-y: auto;
      background: var(--bg-1);
    }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
    #chat::-webkit-scrollbar-track { background: transparent; }

    /* Flat message rows — ST's own .mes anatomy: avatar + [name / text],
       no card background, no bubble, no per-message shadow. */
    .message {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px 8px; position: relative;
      background: rgba(255,255,255,0.03); border-radius: var(--radius-sm); margin: 2px 8px;
    }

    /* ═══════ AVATAR ═══════ */
    .avatar {
      flex: 0 0 50px; width: 50px; height: 50px;
      border-radius: 50%; overflow: hidden;
      background: var(--bg-3);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
      color: var(--text-muted); text-transform: uppercase;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ═══════ MESSAGE BODY ═══════ */
    .bubble-wrap { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .bubble { position: relative; }
    .msg-head { display: flex; align-items: center; gap: 8px; }
    .msg-title { font-weight: bolder; font-size: 15px; flex: 1; min-width: 0; }
    .message.bot .msg-title { color: var(--text-accent); }
    .message.user.ghost { opacity: 0.55; }

    /* ═══════ THINKING ═══════ */
    .thinking {
      margin: 4px 0 6px; border: 1px dashed var(--border-hover);
      border-radius: var(--radius-sm); background: rgba(0,0,0,0.2);
    }
    .thinking summary {
      cursor: pointer; padding: 6px 10px; font-size: 12px;
      color: var(--text-muted); user-select: none;
    }
    .thinking summary:hover { color: var(--text-accent); }
    .thinking-body { padding: 0 10px 8px; font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }

    /* ═══════ MESSAGE ACTIONS ═══════ */
    /* Always rendered (not hover-gated) — hover-only is unreachable on
       touch, which is most real usage of this client. Faded idle, full
       opacity on hover/focus. */
    /* Sits in the name row now, not absolute-overlaid on the whole
       message — it used to float over whatever was at the top of the
       bubble (e.g. a Thinking block), overlapping it. */
    .msg-actions { display: flex; gap: 2px; flex-shrink: 0; opacity: 0.35; transition: opacity 0.15s; }
    .message:hover .msg-actions, .message:focus-within .msg-actions { opacity: 1; }
    .action-btn {
      background: var(--bg-2); border: 1px solid var(--border); color: var(--text-muted);
      width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; transition: all 0.15s; padding: 0;
    }
    .action-btn:hover { color: var(--text-accent); border-color: var(--accent); }
    .action-btn.danger:hover { background: var(--red-dim); color: #fca5a5; border-color: var(--red); }

    /* ═══════ EDIT MODE ═══════ */
    .edit-overlay { margin-top: 6px; }
    .edit-textarea {
      width: 100%; min-height: 100px;
      background: var(--bg-3); border: 1px solid var(--accent);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-family: inherit; font-size: 14px; line-height: 1.55;
      padding: 10px 12px; resize: vertical; outline: none;
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    /* Sticky, not just below a textarea that can grow past the viewport —
       otherwise saving/cancelling a long edit means scrolling all the way down first. */
    .edit-bar {
      position: sticky; top: 4px; z-index: 3;
      display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end;
      background: var(--bg-1); padding: 4px; border-radius: var(--radius-sm);
    }
    .edit-bar button {
      padding: 5px 16px; border-radius: var(--radius-sm); border: none;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    .btn-save { background: var(--accent); color: #1a1200; }
    .btn-save:hover { filter: brightness(1.1); }
    .btn-cancel { background: var(--bg-3); color: var(--text-dim); border: 1px solid var(--border); }
    .btn-cancel:hover { border-color: var(--border-hover); }

    /* ═══════ SWIPE CONTROLS ═══════ */
    /* Faded chevrons, not boxed buttons — matches ST's .swipe_left/.swipe_right */
    .swipe-bar { display: flex; align-items: center; gap: 2px; margin-top: 2px; }
    .swipe-btn {
      background: none; border: none; color: var(--text-primary);
      width: 26px; height: 26px; border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; opacity: 0.3; transition: opacity 0.15s, color 0.15s; padding: 0;
    }
    .swipe-btn:hover:not(:disabled) { opacity: 1; color: var(--text-accent); }
    .swipe-btn:disabled { opacity: 0.12; cursor: default; }
    .swipe-counter { font-size: 11px; color: var(--text-muted); opacity: 0.7; min-width: 30px; text-align: center; font-variant-numeric: tabular-nums; }

    /* ═══════ ST-LIKE TEXT ═══════ */
    .mes-text { padding: 5px 0; line-height: 1.55; word-wrap: break-word; }
    .mes-text p { margin: 0 0 0.55em; }
    .mes-text p:last-child { margin-bottom: 0; }
    .mes-text em { font-style: italic; color: var(--text-muted); }
    .mes-text strong { font-weight: 700; }
    /* No color here on purpose — SillyTavern's own rendered output already
       carries whatever coloring the active preset/regex assigns per
       character (often different colors per speaker); forcing one uniform
       color here would override that. quotes:none just suppresses the
       browser's default auto-inserted quote-mark glyphs. */
    .mes-text q { font-style: normal; quotes: none; }
    .mes-text hr { border: none; border-top: 1px solid var(--border-hover); margin: 10px 0; }
    .mes-text blockquote { border-left: 3px solid var(--accent); margin: 6px 0; padding: 4px 12px; color: var(--text-dim); background: rgba(0,0,0,0.2); }
    .mes-text code { background: rgba(0,0,0,0.3); padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }
    .mes-text pre { background: rgba(0,0,0,0.3); padding: 10px; border-radius: var(--radius-sm); overflow-x: auto; }
    .mes-text pre code { background: none; padding: 0; }

    /* ═══════ BOTTOM DOCK ═══════ */
    #bottom-dock {
      position: fixed; bottom: 0; left: 0; right: 0;
      margin: 0 auto; max-width: 960px;
      display: flex; flex-direction: column;
      pointer-events: none;
    }
    #bottom-dock > * { pointer-events: auto; }

    /* ═══════ GENERATING / TYPING — inline muted text, like ST's own status line ═══════ */
    #generating-indicator {
      padding: 7px 14px;
      font-size: 12.5px;
      color: var(--text-muted);
      font-style: italic;
      background: var(--bg-2);
      border-top: 1px solid var(--border);
      display: none;
      align-items: center; gap: 8px;
    }
    #generating-indicator.active { display: flex; }
    #generating-indicator .spinner {
      width: 11px; height: 11px;
      border: 2px solid var(--border-hover);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    #stop-btn {
      pointer-events: auto;
      background: none; border: none; color: var(--red);
      font-size: 12.5px; font-style: normal; cursor: pointer; padding: 0;
      opacity: 0.85; transition: opacity 0.15s;
    }
    #stop-btn:hover { opacity: 1; text-decoration: underline; }

    #typing-indicator {
      padding: 6px 14px;
      font-size: 12.5px;
      color: var(--text-muted);
      font-style: italic;
      background: var(--bg-2);
    }
    #typing-indicator:empty { display: none; padding: 0; }

    /* ═══════ TOAST ═══════ */
    #toast-container {
      position: fixed; top: 45px; left: 50%;
      transform: translateX(-50%);
      z-index: 100; display: flex; flex-direction: column;
      gap: 6px; align-items: center; pointer-events: none;
    }
    .toast {
      background: rgba(31,31,31,0.95); backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--text-dim); font-size: 13px;
      padding: 6px 16px; border-radius: var(--radius-sm);
      display: flex; align-items: center; gap: 8px;
      animation: toastIn 0.2s ease-out;
      box-shadow: var(--shadow);
      max-width: min(90vw, 420px);
    }
    .toast.fade-out { animation: toastOut 0.3s ease-in forwards; }
    .toast.toast-error { border-color: var(--red); color: #fca5a5; }
    .toast.toast-warning { border-color: var(--amber); color: #fde68a; }
    .toast .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border-hover);
      border-top-color: var(--text-accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

    /* ═══════ INPUT — ST's real anatomy: persona avatar, borderless-ish
       textarea, square icon buttons, no big pill "Send" button ═══════ */
    #chat-input {
      background: var(--bg-2);
      padding: 6px 10px;
      border-top: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 6px;
    }
    /* A native <select> can't render an avatar image inside itself, so
       trying to make this look like a circular avatar button (an earlier
       version of this) just produced an unlabeled blank circle — a real
       control with nothing indicating what it does. Plain and visible beats
       cute and invisible: shows the persona name outright. */
    #persona-select {
      max-width: 110px; flex-shrink: 0; height: 36px;
      padding: 0 8px; background: var(--bg-3);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 13px; outline: none;
      font-family: inherit; cursor: pointer;
    }
    #persona-select:focus { border-color: var(--accent); }
    #message {
      flex: 1 1 auto; padding: 8px 12px;
      background: var(--bg-3); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-size: 14.5px; font-family: inherit; transition: border 0.15s; outline: none;
      resize: none; overflow-y: hidden; line-height: 1.4;
      max-height: 200px; min-height: 36px;
    }
    #message::placeholder { color: var(--text-muted); }
    #message:focus { border-color: var(--accent); }
    #message:disabled { opacity: 0.5; }
    #send-btn {
      flex: 0 0 auto;
      width: 36px; height: 36px;
      background: none; color: var(--accent); border: none;
      border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s;
      font-size: 17px; display: flex; align-items: center; justify-content: center;
      opacity: 0.9;
    }
    #send-btn:hover { opacity: 1; filter: brightness(1.2); }
    #send-btn:disabled { opacity: 0.3; cursor: default; }

    /* ═══════ SESSION PANEL ═══════ */
    #panel-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 199; display: none;
    }
    #panel-backdrop.open { display: block; }
    #session-panel {
      position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
      background: var(--bg-2); border-left: 1px solid var(--border);
      z-index: 200; transition: right 0.2s ease-out;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: -4px 0 20px rgba(0,0,0,0.4);
    }
    #session-panel.open { right: 0; }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .panel-header h2 { font-size: 14px; font-weight: 600; margin: 0; color: var(--text-title); }
    .panel-tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .panel-tab {
      background: none; border: none; color: var(--text-muted); font-family: inherit;
      font-size: 12.5px; padding: 9px 10px; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.15s; opacity: 0.75;
    }
    .panel-tab:hover { opacity: 1; }
    .panel-tab.active { color: var(--text-accent); border-bottom-color: var(--accent); opacity: 1; }
    .panel-body { flex: 1 1 auto; overflow-y: auto; padding: 12px; }
    .panel-tabpage { display: flex; flex-direction: column; gap: 16px; }
    .panel-tabpage[hidden] { display: none; }
    .panel-section h3 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-muted); margin: 0 0 8px;
    }
    .panel-list { display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
    .panel-item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 8px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid transparent; transition: all 0.15s;
    }
    .panel-item:hover { background: var(--bg-3); }
    .panel-item.active { border-color: var(--accent); background: var(--accent-dim); }
    .panel-item .avatar { width: 30px; height: 30px; flex: 0 0 30px; font-size: 11px; }
    .panel-item-name { font-size: 13px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel-item-sub { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel-empty { font-size: 12px; color: var(--text-muted); padding: 6px 0; }
    .panel-btn {
      width: 100%; padding: 8px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--bg-3); color: var(--text-primary); font-size: 13px; cursor: pointer;
      transition: all 0.15s; margin-bottom: 8px;
    }
    .panel-btn:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--text-accent); }
    .panel-select {
      width: 100%; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--bg-3); color: var(--text-primary); font-size: 13px; font-family: inherit; outline: none;
    }
    .panel-select:focus { border-color: var(--accent); }

    /* ═══════ CONFIRM MODAL ═══════ */
    #confirm-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      z-index: 299; display: none; align-items: center; justify-content: center;
    }
    #confirm-backdrop.open { display: flex; }
    #confirm-box {
      width: 100%; max-width: 340px; margin: 20px;
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 20px;
    }
    #confirm-text { font-size: 14px; color: var(--text-primary); line-height: 1.5; margin: 0 0 18px; }
    #confirm-bar { display: flex; gap: 8px; justify-content: flex-end; }
    #confirm-bar button {
      padding: 8px 18px; border-radius: var(--radius-sm); border: none;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    #confirm-ok { background: var(--accent); color: #1a1200; }
    #confirm-ok:hover { filter: brightness(1.1); }
    #confirm-cancel { background: var(--bg-3); color: var(--text-dim); border: 1px solid var(--border); }
    #confirm-cancel:hover { border-color: var(--border-hover); }
  </style>
</head>
<body>
  <div id="online-bar">
    <div class="dot-online" id="conn-dot"></div>
    <div id="online-users">—</div>
    <div class="bar-spacer"></div>
    <div class="context-meter" id="context-meter" title="Estimated chat tokens vs. max context" hidden>
      <span class="context-meter-text" id="context-meter-text">– / –</span>
      <div class="context-meter-bar"><div class="context-meter-fill" id="context-meter-fill" style="width:0%"></div></div>
    </div>
    <button class="icon-btn" id="session-btn" title="Session (character, chats)">☰</button>
  </div>

  <div id="load-older-indicator">Loading older messages…</div>
  <div id="chat"></div>
  <div id="toast-container"></div>

  <div id="bottom-dock">
    <div id="generating-indicator"><div class="spinner"></div><span id="generating-text"></span><button id="stop-btn" title="Stop generation">stop</button></div>
    <div id="typing-indicator"></div>
    <div id="chat-input">
      <select id="persona-select" title="Send as"><option value="">…</option></select>
      <textarea id="message" placeholder="Type a message…" rows="1" title="Enter — send · Shift+Enter — new line · Ctrl+Enter — regenerate"></textarea>
      <button id="send-btn" title="Send (Enter)">➤</button>
    </div>
  </div>

  <div id="confirm-backdrop">
    <div id="confirm-box">
      <p id="confirm-text"></p>
      <label id="confirm-skip-row" style="display:none; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); margin-bottom:16px; cursor:pointer;">
        <input type="checkbox" id="confirm-skip" /> Don't ask again
      </label>
      <div id="confirm-bar">
        <button id="confirm-cancel">Cancel</button>
        <button id="confirm-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="panel-backdrop"></div>
  <div id="session-panel">
    <div class="panel-header">
      <h2>Session</h2>
      <button class="icon-btn" id="panel-close">✕</button>
    </div>
    <div class="panel-tabs">
      <button class="panel-tab active" data-tab="character">Character</button>
      <button class="panel-tab" data-tab="model">Model &amp; Preset</button>
      <button class="panel-tab" data-tab="chats">Chats</button>
    </div>
    <div class="panel-body">
      <div class="panel-tabpage" data-tabpage="character">
        <div class="panel-section">
          <h3>Character</h3>
          <div class="panel-list" id="character-list"><div class="panel-empty">Waiting for extension…</div></div>
        </div>
      </div>
      <div class="panel-tabpage" data-tabpage="model" hidden>
        <div class="panel-section">
          <h3>Model</h3>
          <select id="model-select" class="panel-select"><option value="">Loading…</option></select>
        </div>
        <div class="panel-section">
          <h3>Preset</h3>
          <select id="preset-select" class="panel-select"><option value="">Loading…</option></select>
        </div>
      </div>
      <div class="panel-tabpage" data-tabpage="chats" hidden>
        <div class="panel-section">
          <h3>Chat</h3>
          <button class="panel-btn" id="new-chat-btn">＋ New chat</button>
          <div class="panel-list" id="chat-list"><div class="panel-empty">Open to load past chats…</div></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ═══════════════════════════════════
    //  CONFIG
    // ═══════════════════════════════════

    const NAME_KEY = "stmp_character_name"; // legacy freeform name, used as a last-resort persona match
    const PERSONA_ID_KEY = "stmp_persona_id";

    // ═══════════════════════════════════
    //  STATE
    // ═══════════════════════════════════

    let currentHistory = [];   // everything currently loaded, oldest first
    let historyOffset = 0;     // absolute index (in ST's real chat array) of currentHistory[0]
    let historyTotal = 0;      // total messages that exist server-side, including ones we haven't loaded
    let loadingOlder = false;
    let pendingCommand = null; // tracks active command toast
    let sessionInfo = null;    // characters, personas, current chat/character, tokens
    let isGenerating = false;
    let characterAvatarByName = {};
    let personaAvatarByName = {};

    // ═══════════════════════════════════
    //  PERSONA SELECT (per-player, local)
    // ═══════════════════════════════════

    const personaSelect = document.getElementById("persona-select");

    function getMyPersonaId() {
      return personaSelect.value || localStorage.getItem(PERSONA_ID_KEY) || "";
    }
    function getMyPersonaName() {
      // Guard against the placeholder "Loading personas…"/"No personas
      // configured" option, which has no value and isn't a real persona —
      // showing its text as our name would leak into the online-users list.
      const opt = personaSelect.selectedOptions[0];
      if (opt && opt.value) return opt.textContent;
      return localStorage.getItem(NAME_KEY) || "Guest";
    }

    personaSelect.addEventListener("change", () => {
      localStorage.setItem(PERSONA_ID_KEY, personaSelect.value);
    });

    function renderPersonaSelect(personas) {
      const savedId = localStorage.getItem(PERSONA_ID_KEY);
      const prevValue = personaSelect.value;
      personaSelect.innerHTML = "";
      if (!personas || !personas.length) {
        personaSelect.innerHTML = '<option value="">No personas configured</option>';
        return;
      }
      for (const p of personas) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name;
        personaSelect.appendChild(opt);
      }
      const want = prevValue || savedId;
      if (want && personas.some(p => p.id === want)) {
        personaSelect.value = want;
      } else {
        personaSelect.value = personas[0].id;
        localStorage.setItem(PERSONA_ID_KEY, personaSelect.value);
      }
    }

    // ═══════════════════════════════════
    //  SOCKET.IO CONNECTION
    // ═══════════════════════════════════

    const socket = io({ reconnection: true, reconnectionDelay: 1000 });

    socket.on('connect', () => {
      console.log('[WS] Connected');
      document.getElementById('conn-dot').className = 'dot-online';
      socket.emit('heartbeat', { name: getMyPersonaName() });
    });

    socket.on('disconnect', () => {
      console.log('[WS] Disconnected');
      document.getElementById('conn-dot').className = 'dot-offline';
    });

    // ── Receive chat updates instantly ──
    // The server only ever sends the live tail (not the whole, potentially
    // huge, history) plus where that tail starts and how many messages
    // exist in total. If we'd already loaded an older prefix ourselves
    // (via "Load older messages") and nothing was deleted since, keep it
    // and just refresh the tail; otherwise (first load, or a delete
    // somewhere shifted indices) drop back to just the fresh tail — a
    // delete is rare enough that resetting the scrollback view for it is
    // an acceptable trade for not risking misaligned indices.
    socket.on('chat-update', ({ messages, offset, total }) => {
      const canKeepOlderPrefix = currentHistory.length > 0 && total >= historyTotal && offset <= historyOffset + currentHistory.length;
      if (canKeepOlderPrefix && historyOffset < offset) {
        currentHistory = [...currentHistory.slice(0, offset - historyOffset), ...messages];
      } else {
        currentHistory = messages;
        historyOffset = offset;
      }
      historyTotal = total;
      renderChat(currentHistory);
      // Clear pending command toast when chat updates
      if (pendingCommand) {
        dismissToast(pendingCommand);
        pendingCommand = null;
      }
    });

    // ── Load older messages on demand (server keeps the full history, it
    // just doesn't broadcast all of it on every live update) — triggered
    // by actually scrolling to the top edge, not a standing button. ──
    function loadOlder() {
      if (loadingOlder || historyOffset <= 0) return;
      loadingOlder = true;
      const indicator = document.getElementById('load-older-indicator');
      indicator.classList.add('active');
      const chatEl = document.getElementById('chat');
      const prevScrollHeight = chatEl.scrollHeight;
      socket.emit('load-older', { before: historyOffset }, (chunk) => {
        currentHistory = [...chunk.messages, ...currentHistory];
        historyOffset = chunk.offset;
        renderChat(currentHistory);
        // Keep the view visually still — we just prepended content above
        // whatever the player was looking at, so compensate the scroll
        // position by exactly how much taller the chat got.
        chatEl.scrollTop += chatEl.scrollHeight - prevScrollHeight;
        loadingOlder = false;
        indicator.classList.remove('active');
        // The chat may still not fill the viewport after this chunk (a
        // short window, or a small screen) — nothing to scroll means the
        // 'scroll' listener below will never fire, so check directly.
        if (historyOffset > 0 && chatEl.scrollHeight <= chatEl.clientHeight) loadOlder();
      });
    }

    document.getElementById('chat').addEventListener('scroll', () => {
      const chatEl = document.getElementById('chat');
      if (chatEl.scrollTop < 40) loadOlder();
    });

    // ── Command acknowledged ──
    socket.on('command-ack', ({ type }) => {
      // Toast already shown on send
    });

    // ── Session info: characters, personas, current chat, tokens ──
    socket.on('session-info', (info) => {
      sessionInfo = info;
      characterAvatarByName = {};
      (info.characters || []).forEach(c => { characterAvatarByName[c.name] = c.avatarUrl; });
      personaAvatarByName = {};
      (info.personas || []).forEach(p => { personaAvatarByName[p.name] = p.avatarUrl; });

      renderPersonaSelect(info.personas);
      renderCharacterList(info);
      renderContextMeter(info);
      // Re-render chat so avatars picked up from the fresh maps
      if (currentHistory.length) renderChat(currentHistory);
    });

    // ── AI generation status, visible to everyone ──
    socket.on('generation-status', ({ generating, characterName }) => {
      isGenerating = !!generating;
      const el = document.getElementById('generating-indicator');
      const textEl = document.getElementById('generating-text');
      el.classList.toggle('active', isGenerating);
      textEl.textContent = characterName ? `${characterName} is generating…` : 'Generating…';
      messageInput.disabled = isGenerating;
      document.getElementById('send-btn').disabled = isGenerating;
      if (currentHistory.length) renderChat(currentHistory);
    });

    // ── Errors relayed from SillyTavern's own toasts ──
    socket.on('error', ({ type, message }) => {
      showToast(`⚠ ${message}`, 6000, type === 'warning' ? 'toast-warning' : 'toast-error');
    });

    // ── Past chats list ──
    socket.on('chats-list', ({ chats }) => {
      renderChatList(chats || []);
    });

    // ── Model / preset lists ──
    socket.on('models-list', ({ current, options }) => renderModelSelect(current, options || []));
    socket.on('presets-list', ({ current, options }) => renderPresetSelect(current, options || []));

    // ── Online users ──
    socket.on('online-users', (users) => {
      const el = document.getElementById("online-users");
      el.innerHTML = users.length
        ? users.map(u => `<span class="user-tag">${esc(u)}</span>`).join("")
        : '<span style="color:var(--text-muted)">—</span>';
    });

    // ── Typing ──
    const typingState = new Map(); // name → timeout id

    socket.on('user-typing', ({ name }) => {
      if (name === getMyPersonaName()) return;
      clearTimeout(typingState.get(name));
      typingState.set(name, setTimeout(() => {
        typingState.delete(name);
        renderTyping();
      }, 4000));
      renderTyping();
    });

    function renderTyping() {
      const names = [...typingState.keys()];
      const el = document.getElementById("typing-indicator");
      if (!names.length) { el.textContent = ""; return; }
      el.textContent = names.length === 1
        ? `${names[0]} is typing…`
        : `${names.join(", ")} are typing…`;
    }

    // ── Heartbeat ──
    setInterval(() => socket.emit('heartbeat', { name: getMyPersonaName() }), 5000);

    // ═══════════════════════════════════
    //  CONTEXT / TOKEN METER
    // ═══════════════════════════════════

    function renderContextMeter(info) {
      const el = document.getElementById('context-meter');
      if (!info.maxContext) { el.hidden = true; return; }
      el.hidden = false;
      const used = info.contextTokens || 0;
      const max = info.maxContext;
      const pct = Math.min(100, Math.round((used / max) * 100));
      document.getElementById('context-meter-text').textContent = `${used.toLocaleString()} / ${max.toLocaleString()}`;
      document.getElementById('context-meter-fill').style.width = pct + '%';
      el.classList.toggle('warn', pct >= 75 && pct < 90);
      el.classList.toggle('crit', pct >= 90);
    }

    // ═══════════════════════════════════
    //  CONFIRM MODAL (replaces native confirm() — no URL in the popup)
    // ═══════════════════════════════════

    function askConfirm(text, opts) {
      const skipKey = opts?.skipKey ? `stmp_skip_confirm_${opts.skipKey}` : null;
      if (skipKey && localStorage.getItem(skipKey) === '1') return Promise.resolve(true);

      const backdrop = document.getElementById('confirm-backdrop');
      const skipRow = document.getElementById('confirm-skip-row');
      const skipBox = document.getElementById('confirm-skip');
      document.getElementById('confirm-text').textContent = text;
      skipRow.style.display = skipKey ? 'flex' : 'none';
      skipBox.checked = false;
      backdrop.classList.add('open');
      return new Promise((resolve) => {
        function done(result) {
          if (result && skipKey && skipBox.checked) localStorage.setItem(skipKey, '1');
          backdrop.classList.remove('open');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          backdrop.removeEventListener('click', onBackdrop);
          resolve(result);
        }
        const okBtn = document.getElementById('confirm-ok');
        const cancelBtn = document.getElementById('confirm-cancel');
        function onOk() { done(true); }
        function onCancel() { done(false); }
        function onBackdrop(e) { if (e.target === backdrop) done(false); }
        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        backdrop.addEventListener('click', onBackdrop);
      });
    }

    // ═══════════════════════════════════
    //  SESSION PANEL
    // ═══════════════════════════════════

    const panel = document.getElementById('session-panel');
    const panelBackdrop = document.getElementById('panel-backdrop');

    const tabButtons = [...document.querySelectorAll('.panel-tab')];
    const tabPages = {};
    document.querySelectorAll('.panel-tabpage').forEach(el => tabPages[el.dataset.tabpage] = el);

    function switchTab(name) {
      tabButtons.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
      Object.entries(tabPages).forEach(([k, el]) => { el.hidden = k !== name; });
      if (name === 'model') { sendCmd({ type: 'list-models' }); sendCmd({ type: 'list-presets' }); }
      if (name === 'chats') { sendCmd({ type: 'list-chats' }); }
    }
    tabButtons.forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

    function openPanel() {
      panel.classList.add('open');
      panelBackdrop.classList.add('open');
      switchTab('character');
    }
    function closePanel() {
      panel.classList.remove('open');
      panelBackdrop.classList.remove('open');
    }
    document.getElementById('session-btn').addEventListener('click', openPanel);
    document.getElementById('stop-btn').addEventListener('click', () => {
      sendCmd({ type: 'stop' });
    });
    document.getElementById('panel-close').addEventListener('click', closePanel);
    panelBackdrop.addEventListener('click', closePanel);

    function renderCharacterList(info) {
      const el = document.getElementById('character-list');
      const characters = info.characters || [];
      if (!characters.length) {
        el.innerHTML = '<div class="panel-empty">No characters found</div>';
        return;
      }
      el.innerHTML = '';
      for (const c of characters) {
        const isActive = info.character && info.character.id === c.id;
        const item = document.createElement('div');
        item.className = 'panel-item' + (isActive ? ' active' : '');
        item.appendChild(createAvatar(c.name, c.avatarUrl));
        const name = document.createElement('div');
        name.className = 'panel-item-name';
        name.textContent = c.name;
        item.appendChild(name);
        if (!isActive) {
          item.addEventListener('click', async () => {
            if (!(await askConfirm(`Switch the shared session to "${c.name}"? This changes the chat for everyone.`, { skipKey: 'switch-character' }))) return;
            sendCmd({ type: 'switch-character', characterId: c.id }, `↪ Switching to ${c.name}…`);
            closePanel();
          });
        }
        el.appendChild(item);
      }
    }

    function renderChatList(chats) {
      const el = document.getElementById('chat-list');
      if (!chats.length) {
        el.innerHTML = '<div class="panel-empty">No past chats for this character</div>';
        return;
      }
      el.innerHTML = '';
      const currentFile = sessionInfo?.chatId;
      for (const c of chats) {
        const isActive = c.fileName === currentFile;
        const item = document.createElement('div');
        item.className = 'panel-item' + (isActive ? ' active' : '');
        const info = document.createElement('div');
        info.style.overflow = 'hidden';
        const name = document.createElement('div');
        name.className = 'panel-item-name';
        name.textContent = c.fileName;
        const sub = document.createElement('div');
        sub.className = 'panel-item-sub';
        sub.textContent = (c.messageCount ? `${c.messageCount} msgs` : '') + (c.preview ? ` · ${c.preview}` : '');
        info.appendChild(name);
        info.appendChild(sub);
        item.appendChild(info);
        if (!isActive) {
          item.addEventListener('click', async () => {
            if (!(await askConfirm(`Load chat "${c.fileName}" for everyone?`))) return;
            sendCmd({ type: 'load-chat', fileName: c.fileName }, `📂 Loading ${c.fileName}…`);
            closePanel();
          });
        }
        const delBtn = document.createElement('button');
        delBtn.className = 'action-btn danger'; delBtn.innerHTML = '🗑'; delBtn.title = 'Delete chat';
        delBtn.style.flexShrink = '0';
        delBtn.onclick = async (e) => {
          e.stopPropagation();
          if (!(await askConfirm(`Delete chat "${c.fileName}" for everyone? This cannot be undone.`))) return;
          sendCmd({ type: 'delete-chat', fileName: c.fileName }, `🗑 Deleting ${c.fileName}…`);
        };
        item.appendChild(delBtn);
        el.appendChild(item);
      }
    }

    let currentModelValue = '';
    function renderModelSelect(current, options) {
      currentModelValue = current;
      const el = document.getElementById('model-select');
      el.innerHTML = '';
      if (!options.length) { el.innerHTML = '<option value="">No models found</option>'; return; }
      for (const o of options) {
        const opt = document.createElement('option');
        opt.value = o.value; opt.textContent = o.text || o.value;
        if (o.value === current) opt.selected = true;
        el.appendChild(opt);
      }
    }

    let currentPresetValue = '';
    function renderPresetSelect(current, options) {
      currentPresetValue = current;
      const el = document.getElementById('preset-select');
      el.innerHTML = '';
      if (!options.length) { el.innerHTML = '<option value="">No presets found</option>'; return; }
      for (const name of options) {
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        if (name === current) opt.selected = true;
        el.appendChild(opt);
      }
    }

    document.getElementById('model-select').addEventListener('change', async (e) => {
      const val = e.target.value;
      const prev = currentModelValue;
      if (!val || val === prev) return;
      if (!(await askConfirm(`Switch the shared model to "${val}"? This changes it for everyone.`, { skipKey: 'switch-model' }))) {
        e.target.value = prev;
        return;
      }
      sendCmd({ type: 'set-model', model: val }, `🧠 Switching model…`);
    });

    document.getElementById('preset-select').addEventListener('change', async (e) => {
      const val = e.target.value;
      const prev = currentPresetValue;
      if (!val || val === prev) return;
      if (!(await askConfirm(`Switch the shared preset to "${val}"? This changes it for everyone.`, { skipKey: 'switch-preset' }))) {
        e.target.value = prev;
        return;
      }
      sendCmd({ type: 'set-preset', preset: val }, `⚙ Switching preset…`);
    });

    document.getElementById('new-chat-btn').addEventListener('click', async () => {
      if (!(await askConfirm('Start a new chat for everyone? The current chat is kept in history.'))) return;
      sendCmd({ type: 'new-chat' }, '＋ Starting new chat…');
      closePanel();
    });

    // Light sanitization for ST's own rendered HTML — it's trusted content,
    // but strip event handlers/scripts since it now travels over the network
    function sanitizeRenderedHtml(html) {
      const container = document.createElement('div');
      container.innerHTML = html;
      container.querySelectorAll('script').forEach(el => el.remove());
      container.querySelectorAll('*').forEach(el => {
        for (const attr of [...el.attributes]) {
          const n = attr.name.toLowerCase();
          if (n.startsWith('on') || n === 'srcdoc') el.removeAttribute(attr.name);
          if (n === 'href' && attr.value.trim().toLowerCase().startsWith('javascript:')) {
            el.setAttribute('href', '#');
          }
        }
        if (el.tagName === 'A') el.setAttribute('target', '_blank');
      });
      return container.innerHTML;
    }

    function formatMessage(raw) {
      let text = (raw || "").replace(/\r\n/g, "\n");

      // Strip ST-internal junk
      text = text.replace(/<[^>]*(flex-container|menu_button|drawer-opener|mes_button|swipe_|fa-solid|fa-fw)[^>]*>[\s\S]*?<\/[^>]+>/gi, '');
      text = text.replace(/<[^>]*(flex-container|menu_button|drawer-opener|mes_button|swipe_|fa-solid|fa-fw)[^>]*\/?>/gi, '');

      // Use DOM to split: parse HTML, process text nodes with markdown
      const container = document.createElement('div');
      container.innerHTML = text;

      // Walk all text nodes and apply formatting
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      for (const node of textNodes) {
        let t = node.textContent;
        if (!t.trim()) continue;

        // Check if parent has inline style (inside styled HTML block)
        const inStyledBlock = node.parentElement && node.parentElement.closest('[style]');

        // Convert \n to <br> for text not inside <pre>
        const inPre = node.parentElement && node.parentElement.closest('pre');
        if (!inPre) {
          t = t.replace(/\n/g, '<br>');
        }

        // Apply *italic* and **bold**
        t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        t = t.replace(/\*([^*]+?)\*/g, '<em>$1</em>');

        // Apply dialogue coloring (only on text not inside styled elements to avoid breaking style attrs)
        if (!inStyledBlock) {
          t = t.replace(/"([^"]+)"/g, '<q>“$1”</q>');
          t = t.replace(/“([^”]+)”/g, '<q>“$1”</q>');
        }

        // Replace text node with formatted HTML
        if (t !== node.textContent) {
          const span = document.createElement('span');
          span.innerHTML = t;
          node.parentNode.replaceChild(span, node);
        }
      }

      return container.innerHTML;
    }

    // ═══════════════════════════════════
    //  AVATAR
    // ═══════════════════════════════════

    function resolveAvatarUrl(name, isUser, explicitUrl) {
      if (explicitUrl) return explicitUrl;
      if (isUser && personaAvatarByName[name]) return personaAvatarByName[name];
      if (!isUser && characterAvatarByName[name]) return characterAvatarByName[name];
      return null;
    }

    function createAvatar(name, url) {
      const w = document.createElement("div"); w.className = "avatar";
      if (url) {
        const img = document.createElement("img"); img.src = url; img.alt = name;
        img.onerror = () => { img.remove(); w.appendChild(mkInitials(name)); };
        w.appendChild(img);
      } else { w.appendChild(mkInitials(name)); }
      return w;
    }
    function mkInitials(name) {
      const s = document.createElement("span");
      s.textContent = (name || "?").split(/\s+/).slice(0,2).map(w => w[0]||"").join("") || "?";
      return s;
    }

    // ═══════════════════════════════════
    //  VISIBILITY FILTER
    // ═══════════════════════════════════

    function isVisible(msg) {
      if (msg.is_system) return false;
      if (msg.extra?.type === "narrator" && msg.extra?.isSmallSys) return false;
      if (typeof msg.mes === "string" && msg.mes.includes("flex-container")) return false;
      return true;
    }

    // ═══════════════════════════════════
    //  RENDER
    // ═══════════════════════════════════

    // Signature of everything that affects a message's rendered output —
    // used to skip rebuilding (and re-decoding/flashing avatar <img>s for)
    // messages that haven't actually changed since the last render.
    function messageSignature(msg, isLastBot) {
      const { name, is_user, mes, avatar, swipes, swipe_id, renderedHtml, reasoningHtml } = msg;
      const avatarUrl = resolveAvatarUrl(name, is_user, null) || avatar || '';
      return [name, is_user, avatarUrl, swipe_id, swipes ? swipes.length : 1, isLastBot ? 1 : 0, renderedHtml || mes, reasoningHtml || ''].join('');
    }

    function renderChat(history) {
      const chat = document.getElementById("chat");
      const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;

      let lastBotIdx = -1;
      for (let i = history.length - 1; i >= 0; i--) {
        if (!history[i].is_user && isVisible(history[i])) { lastBotIdx = i; break; }
      }

      const existingByIndex = new Map();
      [...chat.children].forEach(el => existingByIndex.set(el.dataset.index, el));
      const seen = new Set();

      let prevNode = null;
      history.forEach((msg, i) => {
        if (!isVisible(msg)) return;
        const isLastBot = i === lastBotIdx;
        const absIndex = historyOffset + i;
        const key = String(absIndex);
        seen.add(key);
        const sig = messageSignature(msg, isLastBot);
        let node = existingByIndex.get(key);
        if (!node || node.dataset.sig !== sig) {
          const fresh = renderMessage(msg, absIndex, isLastBot);
          fresh.dataset.sig = sig;
          if (node) node.replaceWith(fresh);
          node = fresh;
        }
        const wantPos = prevNode ? prevNode.nextSibling : chat.firstChild;
        if (wantPos !== node) chat.insertBefore(node, wantPos);
        prevNode = node;
      });

      for (const [key, el] of existingByIndex) {
        if (!seen.has(key)) el.remove();
      }

      if (atBottom) chat.scrollTop = chat.scrollHeight;
    }

    function renderMessage(msg, rawIndex, isLastBot) {
      const { name, is_user, mes, avatar, swipes, swipe_id, renderedHtml, reasoningHtml } = msg;
      const el = document.createElement("div");
      el.className = "message" + (is_user ? " user" : " bot");
      el.dataset.index = rawIndex;

      el.appendChild(createAvatar(name, resolveAvatarUrl(name, is_user, null) || avatar));

      const bw = document.createElement("div"); bw.className = "bubble-wrap";
      const bubble = document.createElement("div"); bubble.className = "bubble";

      const head = document.createElement("div"); head.className = "msg-head";
      const title = document.createElement("div"); title.className = "msg-title";
      title.textContent = name;
      head.appendChild(title);

      if (rawIndex >= 0) {
        const actions = document.createElement("div"); actions.className = "msg-actions";
        const editBtn = document.createElement("button"); editBtn.className = "action-btn";
        editBtn.innerHTML = "✎"; editBtn.title = "Edit";
        editBtn.onclick = () => enterEdit(el, rawIndex, mes);
        actions.appendChild(editBtn);
        const delBtn = document.createElement("button"); delBtn.className = "action-btn danger";
        delBtn.innerHTML = "🗑"; delBtn.title = "Delete";
        delBtn.onclick = async () => {
          if (!(await askConfirm("Delete this message for everyone?"))) return;
          sendCmd({ type: "delete", index: rawIndex }, "🗑 Deleting…");
        };
        actions.appendChild(delBtn);
        head.appendChild(actions);
      }
      bubble.appendChild(head);

      if (!is_user && reasoningHtml && reasoningHtml.trim()) {
        const details = document.createElement("details"); details.className = "thinking";
        const summary = document.createElement("summary"); summary.textContent = "🧠 Thinking";
        details.appendChild(summary);
        const body = document.createElement("div"); body.className = "thinking-body";
        body.innerHTML = sanitizeRenderedHtml(reasoningHtml);
        details.appendChild(body);
        bubble.appendChild(details);
      }

      const mesDiv = document.createElement("div"); mesDiv.className = "mes-text";
      if (renderedHtml) {
        // Use SillyTavern's own rendered output — already has macros,
        // display Regex, and formatting applied exactly as ST shows it
        mesDiv.innerHTML = sanitizeRenderedHtml(renderedHtml);
      } else {
        // Fallback: message not yet found in ST's DOM (e.g. optimistic ghost)
        mesDiv.innerHTML = formatMessage(mes);
      }
      bubble.appendChild(mesDiv);

      bw.appendChild(bubble);

      // Swipe bar on last bot msg
      if (!is_user && isLastBot) {
        const idx = swipe_id ?? 0;
        const total = swipes ? swipes.length : 1;
        const bar = document.createElement("div"); bar.className = "swipe-bar";

        if (total > 1) {
          bar.appendChild(mkSwipeBtn("‹", "Previous", idx <= 0 || isGenerating, () =>
            sendCmd({ type: "swipe", direction: "left" }, "◂ Swiping…")));
        }

        const counter = document.createElement("span"); counter.className = "swipe-counter";
        counter.textContent = `${idx + 1}/${total}`;
        bar.appendChild(counter);

        bar.appendChild(mkSwipeBtn("›", "Next / generate", isGenerating, () =>
          sendCmd({ type: "swipe", direction: "right" }, "▸ Generating swipe…")));

        bar.appendChild(mkSwipeBtn("»", "Continue this reply", isGenerating, () =>
          sendCmd({ type: "continue" }, "» Continuing…")));

        bw.appendChild(bar);
      }

      el.appendChild(bw);
      return el;
    }

    function mkSwipeBtn(label, title, disabled, onclick) {
      const b = document.createElement("button"); b.className = "swipe-btn";
      b.textContent = label; b.title = title; b.disabled = disabled; b.onclick = onclick;
      return b;
    }

    // ═══════════════════════════════════
    //  INLINE EDIT
    // ═══════════════════════════════════

    function enterEdit(msgEl, index, original) {
      const bubble = msgEl.querySelector(".bubble");
      if (bubble.querySelector(".edit-overlay")) return;

      const mesText = bubble.querySelector(".mes-text");
      const actionsEl = bubble.querySelector(".msg-actions");
      mesText.style.display = "none";
      if (actionsEl) actionsEl.style.display = "none";

      const overlay = document.createElement("div"); overlay.className = "edit-overlay";
      const ta = document.createElement("textarea"); ta.className = "edit-textarea";
      ta.value = original;
      overlay.appendChild(ta);

      requestAnimationFrame(() => {
        ta.style.height = "auto";
        ta.style.height = Math.max(100, ta.scrollHeight + 4) + "px";
      });
      ta.addEventListener("input", () => {
        ta.style.height = "auto";
        ta.style.height = ta.scrollHeight + 4 + "px";
      });

      const bar = document.createElement("div"); bar.className = "edit-bar";
      const cancel = document.createElement("button"); cancel.className = "btn-cancel";
      cancel.textContent = "Cancel"; cancel.onclick = close;
      const save = document.createElement("button"); save.className = "btn-save";
      save.textContent = "Save";
      save.onclick = () => {
        sendCmd({ type: "edit", index, text: ta.value }, "✎ Saving edit…");
        close();
      };
      bar.appendChild(cancel); bar.appendChild(save);
      overlay.appendChild(bar);
      bubble.appendChild(overlay);
      ta.focus();

      ta.addEventListener("keydown", e => {
        if (e.key === "Escape") close();
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) save.click();
      });

      function close() {
        overlay.remove();
        mesText.style.display = "";
        if (actionsEl) actionsEl.style.display = "";
      }
    }

    // ═══════════════════════════════════
    //  SEND COMMANDS VIA SOCKET
    // ═══════════════════════════════════

    function sendCmd(cmd, toastText) {
      socket.emit('command', cmd);
      if (toastText) pendingCommand = showToast(toastText, 0); // 0 = stays until dismissed
    }

    // ═══════════════════════════════════
    //  TOAST SYSTEM
    // ═══════════════════════════════════

    function showToast(text, duration = 3000, extraClass = '') {
      const container = document.getElementById("toast-container");
      const t = document.createElement("div"); t.className = "toast" + (extraClass ? ' ' + extraClass : '');
      if (duration === 0) t.innerHTML = `<div class="spinner"></div>${esc(text)}`;
      else t.textContent = text;
      container.appendChild(t);

      if (duration > 0) {
        setTimeout(() => dismissToast(t), duration);
      }
      return t;
    }

    function dismissToast(t) {
      if (!t || !t.parentNode) return;
      t.classList.add("fade-out");
      setTimeout(() => t.remove(), 300);
    }

    // ═══════════════════════════════════
    //  GHOST (optimistic)
    // ═══════════════════════════════════

    function appendGhost(name, message) {
      const chat = document.getElementById("chat");
      const g = renderMessage({ name, is_user: true, mes: message, avatar: personaAvatarByName[name] }, -1, false);
      g.classList.add("ghost");
      chat.appendChild(g);
      chat.scrollTop = chat.scrollHeight;
    }

    // ═══════════════════════════════════
    //  INPUT
    // ═══════════════════════════════════

    const messageInput = document.getElementById("message");
    const sendBtn = document.getElementById("send-btn");

    function resizeMessageInput() {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(200, messageInput.scrollHeight) + "px";
    }

    function doSend() {
      const msg = messageInput.value.trim();
      if (!msg || isGenerating) return;
      const personaId = getMyPersonaId();
      if (!personaId) { showToast('⚠ No persona selected', 4000, 'toast-warning'); return; }
      const name = getMyPersonaName();
      sendCmd({ type: "message", personaId, message: msg, name });
      appendGhost(name, msg);
      messageInput.value = "";
      resizeMessageInput();
    }

    sendBtn.addEventListener("click", doSend);

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        sendCmd({ type: "regenerate" }, "⟳ Regenerating…");
        return;
      }
      if (e.key === "Enter" && e.shiftKey) {
        // Let the browser insert a newline naturally
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        doSend();
      }
    });

    messageInput.addEventListener("input", () => {
      socket.emit('typing', { name: getMyPersonaName() });
      resizeMessageInput();
    });

    // ═══════════════════════════════════
    //  UTILS
    // ═══════════════════════════════════

    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  </script>
</body>
