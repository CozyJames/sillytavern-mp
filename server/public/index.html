<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SillyTavern MP Client</title>
  <style>
    :root {
      --bg-0: #0f0f11;
      --bg-1: #18181b;
      --bg-2: #1f1f25;
      --bg-3: #111318;
      --bot-grad-from: #27272a;
      --bot-grad-to: #3f3f46;
      --user-grad-from: #2563eb;
      --user-grad-to: #1d4ed8;
      --user-ghost-opacity: 0.55;
      --text-primary: #e4e4e7;
      --text-dim: #a1a1aa;
      --text-muted: #71717a;
      --text-accent: #93c5fd;
      --text-title: #f8fafc;
      --border: #2a2a31;
      --border-hover: #3f3f46;
      --blue: #3b82f6;
      --blue-dim: rgba(59,130,246,0.15);
      --blue-glow: rgba(59,130,246,0.3);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.15);
      --amber: #f59e0b;
      --amber-dim: rgba(245,158,11,0.15);
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg-0);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    body { display: flex; flex-direction: column; align-items: center; }
    button { font-family: inherit; }

    /* ═══════ ONLINE BAR ═══════ */
    #online-bar {
      width: 100%; max-width: 960px;
      background: var(--bg-2);
      padding: 8px 18px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 13px; color: var(--text-muted);
      border-bottom: 1px solid #1e1e24;
      flex-shrink: 0;
    }
    .dot-online {
      width: 7px; height: 7px;
      background: #22c55e; border-radius: 50%;
      box-shadow: 0 0 6px rgba(34,197,94,0.4);
      flex-shrink: 0;
    }
    .dot-offline {
      width: 7px; height: 7px;
      background: #ef4444; border-radius: 50%;
      box-shadow: 0 0 6px rgba(239,68,68,0.3);
      flex-shrink: 0;
    }
    .user-tag {
      background: rgba(147,197,253,0.08);
      padding: 1px 8px; border-radius: 4px;
      font-size: 12px; color: var(--text-accent);
      border: 1px solid rgba(147,197,253,0.12);
    }
    #online-users { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .bar-spacer { flex: 1 1 auto; }
    .context-meter { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); white-space: nowrap; }
    .context-meter-bar { width: 60px; height: 5px; border-radius: 3px; background: var(--bg-3); overflow: hidden; }
    .context-meter-fill { height: 100%; background: var(--blue); border-radius: 3px; transition: width 0.3s ease; }
    .context-meter-fill.warn { background: var(--amber); }
    .context-meter-fill.crit { background: var(--red); }
    .icon-btn {
      background: none; border: 1px solid var(--border); color: var(--text-dim);
      width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; transition: all 0.15s; padding: 0; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--blue-dim); color: var(--text-accent); border-color: var(--blue); }

    /* ═══════ CHAT ═══════ */
    #chat {
      width: 100%; max-width: 960px;
      flex: 1 1 auto;
      display: flex; flex-direction: column; gap: 14px;
      padding: 16px 18px 150px;
      overflow-y: auto;
      background: var(--bg-1);
    }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    #chat::-webkit-scrollbar-track { background: transparent; }

    .message { display: flex; gap: 12px; max-width: 100%; position: relative; }

    /* ═══════ AVATAR ═══════ */
    .avatar {
      flex: 0 0 44px; width: 44px; height: 44px;
      border-radius: var(--radius-sm); overflow: hidden;
      box-shadow: var(--shadow); background: var(--bg-3);
      display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 16px;
      color: var(--text-accent); text-transform: uppercase;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ═══════ BUBBLE ═══════ */
    .bubble-wrap {
      display: flex; flex-direction: column;
      max-width: 82%; min-width: 0; flex: 1;
    }
    .bubble-wrap:has(.edit-overlay) { max-width: 100%; }
    .message:has(.edit-overlay) { max-width: 100%; }

    .bubble {
      padding: 10px 14px; border-radius: var(--radius);
      box-shadow: var(--shadow); line-height: 1.55;
      word-wrap: break-word; position: relative;
    }
    .message.bot .bubble { background: linear-gradient(135deg, var(--bot-grad-from), var(--bot-grad-to)); }
    .message.user .bubble { background: linear-gradient(135deg, var(--user-grad-from), var(--user-grad-to)); color: var(--text-title); }
    .message.user.ghost .bubble { opacity: var(--user-ghost-opacity); }
    .msg-title { font-weight: 600; margin-bottom: 4px; font-size: 14px; color: var(--text-accent); }

    /* ═══════ THINKING ═══════ */
    .thinking {
      margin-bottom: 8px; border: 1px dashed var(--border-hover);
      border-radius: var(--radius-sm); background: rgba(0,0,0,0.2);
    }
    .thinking summary {
      cursor: pointer; padding: 6px 10px; font-size: 12px;
      color: var(--text-muted); user-select: none;
    }
    .thinking summary:hover { color: var(--text-accent); }
    .thinking-body { padding: 0 10px 8px; font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }

    /* ═══════ HOVER ACTIONS ═══════ */
    .msg-actions { position: absolute; top: 6px; right: 6px; display: none; gap: 3px; z-index: 2; }
    .message:hover .msg-actions { display: flex; }
    .action-btn {
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      border: 1px solid var(--border); color: var(--text-dim);
      width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; transition: all 0.15s; padding: 0;
    }
    .action-btn:hover { background: var(--blue-glow); color: var(--text-accent); border-color: var(--blue); }
    .action-btn.danger:hover { background: var(--red-dim); color: #fca5a5; border-color: var(--red); }

    /* ═══════ EDIT MODE ═══════ */
    .edit-overlay { margin-top: 8px; }
    .edit-textarea {
      width: 100%; min-height: 100px;
      background: var(--bg-3); border: 1px solid var(--blue);
      border-radius: var(--radius-sm); color: var(--text-primary);
      font-family: inherit; font-size: 14px; line-height: 1.55;
      padding: 10px 12px; resize: vertical; outline: none;
      box-shadow: 0 0 0 3px var(--blue-dim);
    }
    .edit-bar { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
    .edit-bar button {
      padding: 5px 16px; border-radius: 6px; border: none;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    .btn-save { background: var(--blue); color: white; }
    .btn-save:hover { background: #2563eb; }
    .btn-cancel { background: var(--border-hover); color: var(--text-dim); }
    .btn-cancel:hover { background: #52525b; }

    /* ═══════ SWIPE CONTROLS ═══════ */
    .swipe-bar { display: flex; align-items: center; gap: 2px; margin-top: 6px; margin-left: 2px; }
    .swipe-btn {
      background: none; border: none; color: var(--text-muted);
      width: 28px; height: 24px; border-radius: 5px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; transition: all 0.15s; padding: 0;
    }
    .swipe-btn:hover { background: var(--blue-dim); color: var(--text-accent); }
    .swipe-btn:disabled { opacity: 0.25; cursor: default; }
    .swipe-btn:disabled:hover { background: none; color: var(--text-muted); }
    .swipe-counter { font-size: 11px; color: var(--text-muted); min-width: 32px; text-align: center; font-variant-numeric: tabular-nums; }

    /* ═══════ ST-LIKE TEXT ═══════ */
    .mes-text p { margin: 0 0 0.55em; }
    .mes-text p:last-child { margin-bottom: 0; }
    .mes-text em { font-style: italic; }
    .mes-text strong { font-weight: 700; }
    .mes-text q { color: #e0cf8f; font-style: normal; quotes: none; }
    .message.user .mes-text q { color: #fde68a; }
    .mes-text hr { border: none; border-top: 1px solid var(--border-hover); margin: 10px 0; }
    .mes-text blockquote { border-left: 3px solid var(--blue); margin: 6px 0; padding: 4px 12px; color: var(--text-dim); }
    .mes-text code { background: rgba(0,0,0,0.3); padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }
    .mes-text pre { background: rgba(0,0,0,0.3); padding: 10px; border-radius: var(--radius-sm); overflow-x: auto; }
    .mes-text pre code { background: none; padding: 0; }

    /* ═══════ BOTTOM DOCK (indicators + input, stacked so they never overlap) ═══════ */
    #bottom-dock {
      position: fixed; bottom: 0; left: 0; right: 0;
      margin: 0 auto; max-width: 960px;
      display: flex; flex-direction: column;
      pointer-events: none;
    }
    #bottom-dock > * { pointer-events: auto; }

    /* ═══════ GENERATING INDICATOR ═══════ */
    #generating-indicator {
      padding: 6px 18px 0;
      font-size: 13px;
      color: var(--text-accent);
      background: var(--bg-2);
      display: none;
      align-items: center; gap: 8px;
    }
    #generating-indicator.active { display: flex; }
    #generating-indicator .spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--border-hover);
      border-top-color: var(--text-accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    #stop-btn {
      pointer-events: auto;
      background: var(--red-dim); color: #fca5a5; border: 1px solid var(--red);
      border-radius: 6px; padding: 2px 10px; font-size: 12px; cursor: pointer;
      transition: all 0.15s;
    }
    #stop-btn:hover { background: var(--red); color: white; }

    /* ═══════ TYPING INDICATOR ═══════ */
    #typing-indicator {
      padding: 4px 18px 0;
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      background: var(--bg-2);
    }
    #typing-indicator:empty { display: none; padding: 0; }

    /* ═══════ TOAST ═══════ */
    #toast-container {
      position: fixed; top: 56px; left: 50%;
      transform: translateX(-50%);
      z-index: 100; display: flex; flex-direction: column;
      gap: 6px; align-items: center; pointer-events: none;
    }
    .toast {
      background: rgba(30,30,36,0.92); backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--text-dim); font-size: 13px;
      padding: 6px 16px; border-radius: 8px;
      display: flex; align-items: center; gap: 8px;
      animation: toastIn 0.2s ease-out;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      max-width: min(90vw, 420px);
    }
    .toast.fade-out { animation: toastOut 0.3s ease-in forwards; }
    .toast.toast-error { border-color: var(--red); color: #fca5a5; }
    .toast.toast-warning { border-color: var(--amber); color: #fcd34d; }
    .toast .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border-hover);
      border-top-color: var(--text-accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

    /* ═══════ INPUT ═══════ */
    #chat-input {
      background: var(--bg-2);
      padding: 12px 16px 16px;
      box-shadow: 0 -4px 14px rgba(0,0,0,0.5);
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    #message {
      flex: 1 1 auto; padding: 11px 14px;
      background: var(--bg-3); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-primary);
      font-size: 15px; font-family: inherit; transition: border 0.15s; outline: none;
      resize: none; overflow-y: hidden; line-height: 1.4;
      max-height: 200px; min-height: 44px;
    }
    #message:focus { border-color: var(--blue); }
    #message:disabled { opacity: 0.5; }
    #character-name { display: flex; flex-direction: column; gap: 4px; width: 180px; }
    #character-name label { font-size: 12px; color: var(--text-muted); }
    #persona-select {
      padding: 9px 12px; background: var(--bg-3);
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text-primary); font-size: 14px; outline: none;
      font-family: inherit;
    }
    #persona-select:focus { border-color: var(--blue); }
    #send-btn {
      flex: 0 0 auto; align-self: flex-end;
      background: var(--blue); color: white; border: none;
      border-radius: var(--radius); padding: 0 18px; height: 44px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    #send-btn:hover { background: #2563eb; }
    #send-btn:disabled { opacity: 0.5; cursor: default; }
    .input-hint { width: 100%; font-size: 11px; color: #3f3f46; text-align: right; margin-top: -4px; }

    @media (max-width: 560px) {
      #chat-input { flex-direction: column; }
      #character-name { width: 100%; }
      #send-btn { align-self: stretch; height: 40px; }
    }

    /* ═══════ SESSION PANEL ═══════ */
    #panel-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 199; display: none;
    }
    #panel-backdrop.open { display: block; }
    #session-panel {
      position: fixed; top: 0; right: -340px; width: 320px; height: 100%;
      background: var(--bg-2); border-left: 1px solid var(--border);
      z-index: 200; transition: right 0.2s ease-out;
      display: flex; flex-direction: column; overflow: hidden;
    }
    #session-panel.open { right: 0; }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .panel-header h2 { font-size: 15px; margin: 0; color: var(--text-title); }
    .panel-body { flex: 1 1 auto; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 18px; }
    .panel-section h3 {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-muted); margin: 0 0 8px;
    }
    .panel-list { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
    .panel-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 8px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid transparent; transition: all 0.15s;
    }
    .panel-item:hover { background: var(--bg-3); }
    .panel-item.active { border-color: var(--blue); background: var(--blue-dim); }
    .panel-item .avatar { width: 32px; height: 32px; flex: 0 0 32px; font-size: 12px; }
    .panel-item-name { font-size: 13px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel-item-sub { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel-empty { font-size: 12px; color: var(--text-muted); padding: 6px 0; }
    .panel-btn {
      width: 100%; padding: 9px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--bg-3); color: var(--text-primary); font-size: 13px; cursor: pointer;
      transition: all 0.15s; margin-bottom: 8px;
    }
    .panel-btn:hover { background: var(--blue-dim); border-color: var(--blue); color: var(--text-accent); }
  </style>
</head>
<body>
  <div id="online-bar">
    <div class="dot-online" id="conn-dot"></div>
    <span>Online:</span>
    <div id="online-users">—</div>
    <div class="bar-spacer"></div>
    <div class="context-meter" id="context-meter" title="Estimated chat tokens vs. max context" hidden>
      <span id="context-meter-text">– / –</span>
      <div class="context-meter-bar"><div class="context-meter-fill" id="context-meter-fill" style="width:0%"></div></div>
    </div>
    <button class="icon-btn" id="session-btn" title="Session (character, chats)">☰</button>
  </div>

  <div id="chat"></div>
  <div id="toast-container"></div>

  <div id="bottom-dock">
    <div id="generating-indicator"><div class="spinner"></div><span id="generating-text"></span><button id="stop-btn" title="Stop generation">⏹ Stop</button></div>
    <div id="typing-indicator"></div>
    <div id="chat-input">
      <textarea id="message" placeholder="Type your message here…" rows="1"></textarea>
      <div id="character-name">
        <label for="persona-select">Send as</label>
        <select id="persona-select"><option value="">Loading personas…</option></select>
      </div>
      <button id="send-btn" title="Send (Enter)">Send</button>
      <div class="input-hint">Enter — send · Shift+Enter — new line · Ctrl+Enter — regenerate</div>
    </div>
  </div>

  <div id="panel-backdrop"></div>
  <div id="session-panel">
    <div class="panel-header">
      <h2>Session</h2>
      <button class="icon-btn" id="panel-close">✕</button>
    </div>
    <div class="panel-body">
      <div class="panel-section">
        <h3>Character</h3>
        <div class="panel-list" id="character-list"><div class="panel-empty">Waiting for extension…</div></div>
      </div>
      <div class="panel-section">
        <h3>Chat</h3>
        <button class="panel-btn" id="new-chat-btn">＋ New chat</button>
        <div class="panel-list" id="chat-list"><div class="panel-empty">Open to load past chats…</div></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ═══════════════════════════════════
    //  CONFIG
    // ═══════════════════════════════════

    const fallbackAvatars = {
      James: "/avatars/james.jpg",
      "The Narrator": "/avatars/narrator.jpg",
    };

    const NAME_KEY = "stmp_character_name"; // legacy freeform name, used as a last-resort persona match
    const PERSONA_ID_KEY = "stmp_persona_id";

    // ═══════════════════════════════════
    //  STATE
    // ═══════════════════════════════════

    let currentHistory = [];
    let pendingCommand = null; // tracks active command toast
    let sessionInfo = null;    // characters, personas, current chat/character, tokens
    let isGenerating = false;
    let characterAvatarByName = {};
    let personaAvatarByName = {};

    // ═══════════════════════════════════
    //  PERSONA SELECT (per-player, local)
    // ═══════════════════════════════════

    const personaSelect = document.getElementById("persona-select");

    function getMyPersonaId() {
      return personaSelect.value || localStorage.getItem(PERSONA_ID_KEY) || "";
    }
    function getMyPersonaName() {
      // Guard against the placeholder "Loading personas…"/"No personas
      // configured" option, which has no value and isn't a real persona —
      // showing its text as our name would leak into the online-users list.
      const opt = personaSelect.selectedOptions[0];
      if (opt && opt.value) return opt.textContent;
      return localStorage.getItem(NAME_KEY) || "Guest";
    }

    personaSelect.addEventListener("change", () => {
      localStorage.setItem(PERSONA_ID_KEY, personaSelect.value);
    });

    function renderPersonaSelect(personas) {
      const savedId = localStorage.getItem(PERSONA_ID_KEY);
      const prevValue = personaSelect.value;
      personaSelect.innerHTML = "";
      if (!personas || !personas.length) {
        personaSelect.innerHTML = '<option value="">No personas configured</option>';
        return;
      }
      for (const p of personas) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = p.name;
        personaSelect.appendChild(opt);
      }
      const want = prevValue || savedId;
      if (want && personas.some(p => p.id === want)) {
        personaSelect.value = want;
      } else {
        personaSelect.value = personas[0].id;
        localStorage.setItem(PERSONA_ID_KEY, personaSelect.value);
      }
    }

    // ═══════════════════════════════════
    //  SOCKET.IO CONNECTION
    // ═══════════════════════════════════

    const socket = io({ reconnection: true, reconnectionDelay: 1000 });

    socket.on('connect', () => {
      console.log('[WS] Connected');
      document.getElementById('conn-dot').className = 'dot-online';
      socket.emit('heartbeat', { name: getMyPersonaName() });
    });

    socket.on('disconnect', () => {
      console.log('[WS] Disconnected');
      document.getElementById('conn-dot').className = 'dot-offline';
    });

    // ── Receive chat updates instantly ──
    socket.on('chat-update', (history) => {
      currentHistory = history;
      renderChat(history);
      // Clear pending command toast when chat updates
      if (pendingCommand) {
        dismissToast(pendingCommand);
        pendingCommand = null;
      }
    });

    // ── Command acknowledged ──
    socket.on('command-ack', ({ type }) => {
      // Toast already shown on send
    });

    // ── Session info: characters, personas, current chat, tokens ──
    socket.on('session-info', (info) => {
      sessionInfo = info;
      characterAvatarByName = {};
      (info.characters || []).forEach(c => { characterAvatarByName[c.name] = c.avatarUrl; });
      personaAvatarByName = {};
      (info.personas || []).forEach(p => { personaAvatarByName[p.name] = p.avatarUrl; });

      renderPersonaSelect(info.personas);
      renderCharacterList(info);
      renderContextMeter(info);
      // Re-render chat so avatars picked up from the fresh maps
      if (currentHistory.length) renderChat(currentHistory);
    });

    // ── AI generation status, visible to everyone ──
    socket.on('generation-status', ({ generating, characterName }) => {
      isGenerating = !!generating;
      const el = document.getElementById('generating-indicator');
      const textEl = document.getElementById('generating-text');
      el.classList.toggle('active', isGenerating);
      textEl.textContent = characterName ? `${characterName} is generating…` : 'Generating…';
      messageInput.disabled = isGenerating;
      document.getElementById('send-btn').disabled = isGenerating;
      if (currentHistory.length) renderChat(currentHistory);
    });

    // ── Errors relayed from SillyTavern's own toasts ──
    socket.on('error', ({ type, message }) => {
      showToast(`⚠ ${message}`, 6000, type === 'warning' ? 'toast-warning' : 'toast-error');
    });

    // ── Past chats list ──
    socket.on('chats-list', ({ chats }) => {
      renderChatList(chats || []);
    });

    // ── Online users ──
    socket.on('online-users', (users) => {
      const el = document.getElementById("online-users");
      el.innerHTML = users.length
        ? users.map(u => `<span class="user-tag">${esc(u)}</span>`).join("")
        : '<span style="color:#52525b">—</span>';
    });

    // ── Typing ──
    const typingState = new Map(); // name → timeout id

    socket.on('user-typing', ({ name }) => {
      if (name === getMyPersonaName()) return;
      clearTimeout(typingState.get(name));
      typingState.set(name, setTimeout(() => {
        typingState.delete(name);
        renderTyping();
      }, 4000));
      renderTyping();
    });

    function renderTyping() {
      const names = [...typingState.keys()];
      const el = document.getElementById("typing-indicator");
      if (!names.length) { el.textContent = ""; return; }
      el.textContent = names.length === 1
        ? `${names[0]} is typing…`
        : `${names.join(", ")} are typing…`;
    }

    // ── Heartbeat ──
    setInterval(() => socket.emit('heartbeat', { name: getMyPersonaName() }), 5000);

    // ═══════════════════════════════════
    //  CONTEXT / TOKEN METER
    // ═══════════════════════════════════

    function renderContextMeter(info) {
      const el = document.getElementById('context-meter');
      if (!info.maxContext) { el.hidden = true; return; }
      el.hidden = false;
      const used = info.contextTokens || 0;
      const max = info.maxContext;
      const pct = Math.min(100, Math.round((used / max) * 100));
      document.getElementById('context-meter-text').textContent =
        `${used.toLocaleString()} / ${max.toLocaleString()} (${pct}%)`;
      const fill = document.getElementById('context-meter-fill');
      fill.style.width = pct + '%';
      fill.classList.toggle('warn', pct >= 75 && pct < 90);
      fill.classList.toggle('crit', pct >= 90);
    }

    // ═══════════════════════════════════
    //  SESSION PANEL
    // ═══════════════════════════════════

    const panel = document.getElementById('session-panel');
    const panelBackdrop = document.getElementById('panel-backdrop');

    function openPanel() {
      panel.classList.add('open');
      panelBackdrop.classList.add('open');
      sendCmd({ type: 'list-chats' });
    }
    function closePanel() {
      panel.classList.remove('open');
      panelBackdrop.classList.remove('open');
    }
    document.getElementById('session-btn').addEventListener('click', openPanel);
    document.getElementById('stop-btn').addEventListener('click', () => {
      sendCmd({ type: 'stop' });
    });
    document.getElementById('panel-close').addEventListener('click', closePanel);
    panelBackdrop.addEventListener('click', closePanel);

    function renderCharacterList(info) {
      const el = document.getElementById('character-list');
      const characters = info.characters || [];
      if (!characters.length) {
        el.innerHTML = '<div class="panel-empty">No characters found</div>';
        return;
      }
      el.innerHTML = '';
      for (const c of characters) {
        const isActive = info.character && info.character.id === c.id;
        const item = document.createElement('div');
        item.className = 'panel-item' + (isActive ? ' active' : '');
        item.appendChild(createAvatar(c.name, c.avatarUrl));
        const name = document.createElement('div');
        name.className = 'panel-item-name';
        name.textContent = c.name;
        item.appendChild(name);
        if (!isActive) {
          item.addEventListener('click', () => {
            if (!confirm(`Switch the shared session to "${c.name}"? This changes the chat for everyone.`)) return;
            sendCmd({ type: 'switch-character', characterId: c.id }, `↪ Switching to ${c.name}…`);
            closePanel();
          });
        }
        el.appendChild(item);
      }
    }

    function renderChatList(chats) {
      const el = document.getElementById('chat-list');
      if (!chats.length) {
        el.innerHTML = '<div class="panel-empty">No past chats for this character</div>';
        return;
      }
      el.innerHTML = '';
      const currentFile = sessionInfo?.chatId;
      for (const c of chats) {
        const isActive = c.fileName === currentFile;
        const item = document.createElement('div');
        item.className = 'panel-item' + (isActive ? ' active' : '');
        const info = document.createElement('div');
        info.style.overflow = 'hidden';
        const name = document.createElement('div');
        name.className = 'panel-item-name';
        name.textContent = c.fileName;
        const sub = document.createElement('div');
        sub.className = 'panel-item-sub';
        sub.textContent = (c.messageCount ? `${c.messageCount} msgs` : '') + (c.preview ? ` · ${c.preview}` : '');
        info.appendChild(name);
        info.appendChild(sub);
        item.appendChild(info);
        if (!isActive) {
          item.addEventListener('click', () => {
            if (!confirm(`Load chat "${c.fileName}" for everyone?`)) return;
            sendCmd({ type: 'load-chat', fileName: c.fileName }, `📂 Loading ${c.fileName}…`);
            closePanel();
          });
        }
        const delBtn = document.createElement('button');
        delBtn.className = 'action-btn danger'; delBtn.innerHTML = '🗑'; delBtn.title = 'Delete chat';
        delBtn.style.flexShrink = '0';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          if (!confirm(`Delete chat "${c.fileName}" for everyone? This cannot be undone.`)) return;
          sendCmd({ type: 'delete-chat', fileName: c.fileName }, `🗑 Deleting ${c.fileName}…`);
        };
        item.appendChild(delBtn);
        el.appendChild(item);
      }
    }

    document.getElementById('new-chat-btn').addEventListener('click', () => {
      if (!confirm('Start a new chat for everyone? The current chat is kept in history.')) return;
      sendCmd({ type: 'new-chat' }, '＋ Starting new chat…');
      closePanel();
    });

    // Light sanitization for ST's own rendered HTML — it's trusted content,
    // but strip event handlers/scripts since it now travels over the network
    function sanitizeRenderedHtml(html) {
      const container = document.createElement('div');
      container.innerHTML = html;
      container.querySelectorAll('script').forEach(el => el.remove());
      container.querySelectorAll('*').forEach(el => {
        for (const attr of [...el.attributes]) {
          const n = attr.name.toLowerCase();
          if (n.startsWith('on') || n === 'srcdoc') el.removeAttribute(attr.name);
          if (n === 'href' && attr.value.trim().toLowerCase().startsWith('javascript:')) {
            el.setAttribute('href', '#');
          }
        }
        if (el.tagName === 'A') el.setAttribute('target', '_blank');
      });
      return container.innerHTML;
    }

    function formatMessage(raw) {
      let text = (raw || "").replace(/\r\n/g, "\n");

      // Strip ST-internal junk
      text = text.replace(/<[^>]*(flex-container|menu_button|drawer-opener|mes_button|swipe_|fa-solid|fa-fw)[^>]*>[\s\S]*?<\/[^>]+>/gi, '');
      text = text.replace(/<[^>]*(flex-container|menu_button|drawer-opener|mes_button|swipe_|fa-solid|fa-fw)[^>]*\/?>/gi, '');

      // Use DOM to split: parse HTML, process text nodes with markdown
      const container = document.createElement('div');
      container.innerHTML = text;

      // Walk all text nodes and apply formatting
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);

      for (const node of textNodes) {
        let t = node.textContent;
        if (!t.trim()) continue;

        // Check if parent has inline style (inside styled HTML block)
        const inStyledBlock = node.parentElement && node.parentElement.closest('[style]');

        // Convert \n to <br> for text not inside <pre>
        const inPre = node.parentElement && node.parentElement.closest('pre');
        if (!inPre) {
          t = t.replace(/\n/g, '<br>');
        }

        // Apply *italic* and **bold**
        t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        t = t.replace(/\*([^*]+?)\*/g, '<em>$1</em>');

        // Apply dialogue coloring (only on text not inside styled elements to avoid breaking style attrs)
        if (!inStyledBlock) {
          t = t.replace(/"([^"]+)"/g, '<q>“$1”</q>');
          t = t.replace(/“([^”]+)”/g, '<q>“$1”</q>');
        }

        // Replace text node with formatted HTML
        if (t !== node.textContent) {
          const span = document.createElement('span');
          span.innerHTML = t;
          node.parentNode.replaceChild(span, node);
        }
      }

      return container.innerHTML;
    }

    // ═══════════════════════════════════
    //  AVATAR
    // ═══════════════════════════════════

    function resolveAvatarUrl(name, isUser, explicitUrl) {
      if (explicitUrl) return explicitUrl;
      if (isUser && personaAvatarByName[name]) return personaAvatarByName[name];
      if (!isUser && characterAvatarByName[name]) return characterAvatarByName[name];
      return fallbackAvatars[name] || null;
    }

    function createAvatar(name, url) {
      const w = document.createElement("div"); w.className = "avatar";
      if (url) {
        const img = document.createElement("img"); img.src = url; img.alt = name;
        img.onerror = () => { img.remove(); w.appendChild(mkInitials(name)); };
        w.appendChild(img);
      } else { w.appendChild(mkInitials(name)); }
      return w;
    }
    function mkInitials(name) {
      const s = document.createElement("span");
      s.textContent = (name || "?").split(/\s+/).slice(0,2).map(w => w[0]||"").join("") || "?";
      return s;
    }

    // ═══════════════════════════════════
    //  VISIBILITY FILTER
    // ═══════════════════════════════════

    function isVisible(msg) {
      if (msg.is_system) return false;
      if (msg.extra?.type === "narrator" && msg.extra?.isSmallSys) return false;
      if (typeof msg.mes === "string" && msg.mes.includes("flex-container")) return false;
      return true;
    }

    // ═══════════════════════════════════
    //  RENDER
    // ═══════════════════════════════════

    function renderChat(history) {
      const chat = document.getElementById("chat");
      const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;

      let lastBotIdx = -1;
      for (let i = history.length - 1; i >= 0; i--) {
        if (!history[i].is_user && isVisible(history[i])) { lastBotIdx = i; break; }
      }

      chat.innerHTML = "";
      history.forEach((msg, i) => {
        if (!isVisible(msg)) return;
        chat.appendChild(renderMessage(msg, i, i === lastBotIdx));
      });

      if (atBottom) chat.scrollTop = chat.scrollHeight;
    }

    function renderMessage(msg, rawIndex, isLastBot) {
      const { name, is_user, mes, avatar, swipes, swipe_id, renderedHtml, reasoningHtml } = msg;
      const el = document.createElement("div");
      el.className = "message" + (is_user ? " user" : " bot");
      el.dataset.index = rawIndex;

      el.appendChild(createAvatar(name, resolveAvatarUrl(name, is_user, null) || avatar));

      const bw = document.createElement("div"); bw.className = "bubble-wrap";
      const bubble = document.createElement("div"); bubble.className = "bubble";

      const title = document.createElement("div"); title.className = "msg-title";
      title.textContent = name;
      bubble.appendChild(title);

      if (!is_user && reasoningHtml && reasoningHtml.trim()) {
        const details = document.createElement("details"); details.className = "thinking";
        const summary = document.createElement("summary"); summary.textContent = "🧠 Thinking";
        details.appendChild(summary);
        const body = document.createElement("div"); body.className = "thinking-body";
        body.innerHTML = sanitizeRenderedHtml(reasoningHtml);
        details.appendChild(body);
        bubble.appendChild(details);
      }

      const mesDiv = document.createElement("div"); mesDiv.className = "mes-text";
      if (renderedHtml) {
        // Use SillyTavern's own rendered output — already has macros,
        // display Regex, and formatting applied exactly as ST shows it
        mesDiv.innerHTML = sanitizeRenderedHtml(renderedHtml);
      } else {
        // Fallback: message not yet found in ST's DOM (e.g. optimistic ghost)
        mesDiv.innerHTML = formatMessage(mes);
      }
      bubble.appendChild(mesDiv);

      // Hover actions
      if (rawIndex >= 0) {
        const actions = document.createElement("div"); actions.className = "msg-actions";
        const editBtn = document.createElement("button"); editBtn.className = "action-btn";
        editBtn.innerHTML = "✎"; editBtn.title = "Edit";
        editBtn.onclick = () => enterEdit(el, rawIndex, mes);
        actions.appendChild(editBtn);
        const delBtn = document.createElement("button"); delBtn.className = "action-btn danger";
        delBtn.innerHTML = "🗑"; delBtn.title = "Delete";
        delBtn.onclick = () => {
          if (!confirm("Delete this message for everyone?")) return;
          sendCmd({ type: "delete", index: rawIndex }, "🗑 Deleting…");
        };
        actions.appendChild(delBtn);
        bubble.appendChild(actions);
      }

      bw.appendChild(bubble);

      // Swipe bar on last bot msg
      if (!is_user && isLastBot) {
        const idx = swipe_id ?? 0;
        const total = swipes ? swipes.length : 1;
        const bar = document.createElement("div"); bar.className = "swipe-bar";

        if (total > 1) {
          bar.appendChild(mkSwipeBtn("◂", "Previous", idx <= 0 || isGenerating, () =>
            sendCmd({ type: "swipe", direction: "left" }, "◂ Swiping…")));
        }

        const counter = document.createElement("span"); counter.className = "swipe-counter";
        counter.textContent = `${idx + 1} / ${total}`;
        bar.appendChild(counter);

        bar.appendChild(mkSwipeBtn("▸", "Next / generate", isGenerating, () =>
          sendCmd({ type: "swipe", direction: "right" }, "▸ Generating swipe…")));

        bar.appendChild(mkSwipeBtn("⏩", "Continue this reply", isGenerating, () =>
          sendCmd({ type: "continue" }, "⏩ Continuing…")));

        bw.appendChild(bar);
      }

      el.appendChild(bw);
      return el;
    }

    function mkSwipeBtn(label, title, disabled, onclick) {
      const b = document.createElement("button"); b.className = "swipe-btn";
      b.textContent = label; b.title = title; b.disabled = disabled; b.onclick = onclick;
      return b;
    }

    // ═══════════════════════════════════
    //  INLINE EDIT
    // ═══════════════════════════════════

    function enterEdit(msgEl, index, original) {
      const bubble = msgEl.querySelector(".bubble");
      if (bubble.querySelector(".edit-overlay")) return;

      const mesText = bubble.querySelector(".mes-text");
      const actionsEl = bubble.querySelector(".msg-actions");
      mesText.style.display = "none";
      if (actionsEl) actionsEl.style.display = "none";

      const overlay = document.createElement("div"); overlay.className = "edit-overlay";
      const ta = document.createElement("textarea"); ta.className = "edit-textarea";
      ta.value = original;
      overlay.appendChild(ta);

      requestAnimationFrame(() => {
        ta.style.height = "auto";
        ta.style.height = Math.max(100, ta.scrollHeight + 4) + "px";
      });
      ta.addEventListener("input", () => {
        ta.style.height = "auto";
        ta.style.height = ta.scrollHeight + 4 + "px";
      });

      const bar = document.createElement("div"); bar.className = "edit-bar";
      const cancel = document.createElement("button"); cancel.className = "btn-cancel";
      cancel.textContent = "Cancel"; cancel.onclick = close;
      const save = document.createElement("button"); save.className = "btn-save";
      save.textContent = "Save";
      save.onclick = () => {
        sendCmd({ type: "edit", index, text: ta.value }, "✎ Saving edit…");
        close();
      };
      bar.appendChild(cancel); bar.appendChild(save);
      overlay.appendChild(bar);
      bubble.appendChild(overlay);
      ta.focus();

      ta.addEventListener("keydown", e => {
        if (e.key === "Escape") close();
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) save.click();
      });

      function close() {
        overlay.remove();
        mesText.style.display = "";
        if (actionsEl) actionsEl.style.display = "";
      }
    }

    // ═══════════════════════════════════
    //  SEND COMMANDS VIA SOCKET
    // ═══════════════════════════════════

    function sendCmd(cmd, toastText) {
      socket.emit('command', cmd);
      if (toastText) pendingCommand = showToast(toastText, 0); // 0 = stays until dismissed
    }

    // ═══════════════════════════════════
    //  TOAST SYSTEM
    // ═══════════════════════════════════

    function showToast(text, duration = 3000, extraClass = '') {
      const container = document.getElementById("toast-container");
      const t = document.createElement("div"); t.className = "toast" + (extraClass ? ' ' + extraClass : '');
      if (duration === 0) t.innerHTML = `<div class="spinner"></div>${esc(text)}`;
      else t.textContent = text;
      container.appendChild(t);

      if (duration > 0) {
        setTimeout(() => dismissToast(t), duration);
      }
      return t;
    }

    function dismissToast(t) {
      if (!t || !t.parentNode) return;
      t.classList.add("fade-out");
      setTimeout(() => t.remove(), 300);
    }

    // ═══════════════════════════════════
    //  GHOST (optimistic)
    // ═══════════════════════════════════

    function appendGhost(name, message) {
      const chat = document.getElementById("chat");
      const g = renderMessage({ name, is_user: true, mes: message, avatar: personaAvatarByName[name] || fallbackAvatars[name] }, -1, false);
      g.classList.add("ghost");
      chat.appendChild(g);
      chat.scrollTop = chat.scrollHeight;
    }

    // ═══════════════════════════════════
    //  INPUT
    // ═══════════════════════════════════

    const messageInput = document.getElementById("message");
    const sendBtn = document.getElementById("send-btn");

    function resizeMessageInput() {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(200, messageInput.scrollHeight) + "px";
    }

    function doSend() {
      const msg = messageInput.value.trim();
      if (!msg || isGenerating) return;
      const personaId = getMyPersonaId();
      if (!personaId) { showToast('⚠ No persona selected', 4000, 'toast-warning'); return; }
      const name = getMyPersonaName();
      sendCmd({ type: "message", personaId, message: msg, name });
      appendGhost(name, msg);
      messageInput.value = "";
      resizeMessageInput();
    }

    sendBtn.addEventListener("click", doSend);

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        sendCmd({ type: "regenerate" }, "⟳ Regenerating…");
        return;
      }
      if (e.key === "Enter" && e.shiftKey) {
        // Let the browser insert a newline naturally
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        doSend();
      }
    });

    messageInput.addEventListener("input", () => {
      socket.emit('typing', { name: getMyPersonaName() });
      resizeMessageInput();
    });

    // ═══════════════════════════════════
    //  UTILS
    // ═══════════════════════════════════

    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

  </script>
</body>
